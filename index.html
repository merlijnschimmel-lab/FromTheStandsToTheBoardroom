.decision-hero{border-radius:23px;background:radial-gradient(ellipse at 80% 0%,#4d8f5666,transparent 55%),linear-gradient(115deg,#1f4035,#10232b);box-shadow:inset 0 1px #ffffff22,0 15px 50px #0003}.decision-card{min-height:235px}.decision-card:hover{transform:translateY(-3px)}.option-number{font-size:33px}.boardroom-promo{border-radius:20px;background:linear-gradient(115deg,#234634,#152e32);box-shadow:inset 0 1px #ffffff19,0 16px 34px #0002}
.modal-backdrop{backdrop-filter:blur(7px);background:#050a0cdb}.modal{background:linear-gradient(160deg,#1e3434,#111f2a);border:1px solid #658b6a;border-radius:24px;box-shadow:0 30px 100px #000b}.field{background:#102127;border-color:#3c5c54}.toast{backdrop-filter:blur(10px);box-shadow:0 18px 60px #0008}.season-tile{background:#1b322d;border-color:#3b5d4c}

@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{transition:none!important;animation:none!important}}

</head><body><div id="app"></div><script>
'use strict';
const KEY='boardroom-save-v1';
const BASE_PLAYERS=[{id:1,name:'Alex Morgan',pos:'ST',rating:71,age:23,wage:450},{id:2,name:'Leo Fernández',pos:'CAM',rating:73,age:25,wage:510},{id:3,name:'Noah Fischer',pos:'CM',rating:69,age:22,wage:350},{id:4,name:'Milan De Vries',pos:'CB',rating:72,age:27,wage:480},{id:5,name:'Oliver Hart',pos:'GK',rating:70,age:26,wage:390},{id:6,name:'Luca Rossi',pos:'LW',rating:68,age:20,wage:310},{id:7,name:'Sam Bennett',pos:'RB',rating:67,age:24,wage:280},{id:8,name:'Mateo Silva',pos:'CDM',rating:70,age:28,wage:400},{id:9,name:'Daniel Price',pos:'LB',rating:68,age:22,wage:320},{id:10,name:'Gabriel Torres',pos:'CB',rating:69,age:24,wage:360},{id:11,name:'Jayden Cole',pos:'RW',rating:70,age:21,wage:370},{id:12,name:'Finn O’Connor',pos:'GK',rating:64,age:20,wage:210},{id:13,name:'Hugo Lambert',pos:'CB',rating:66,age:23,wage:260},{id:14,name:'Emre Yilmaz',pos:'LB',rating:65,age:21,wage:230},{id:15,name:'Oscar Jensen',pos:'CM',rating:67,age:25,wage:290},{id:16,name:'Lucas Pereira',pos:'RW',rating:66,age:20,wage:250},{id:17,name:'Benjamin Scott',pos:'ST',rating:68,age:24,wage:340},{id:18,name:'Nico Müller',pos:'CDM',rating:65,age:22,wage:240}];
const MARKET=[{id:101,name:'Ethan Brooks',pos:'ST',rating:82,age:24,cost:2200000,wage:1100},{id:102,name:'Thiago Costa',pos:'CAM',rating:79,age:22,cost:1600000,wage:850},{id:103,name:'Jonas Weber',pos:'CB',rating:81,age:25,cost:1900000,wage:900},{id:104,name:'Emil Sørensen',pos:'GK',rating:78,age:23,cost:1250000,wage:700},{id:105,name:'Rafael Mendes',pos:'LW',rating:76,age:21,cost:990000,wage:580},{id:106,name:'James Okafor',pos:'CM',rating:75,age:19,cost:890000,wage:470},{id:107,name:'Victor Moreau',pos:'RB',rating:80,age:26,cost:1750000,wage:830},{id:108,name:'Finn Walker',pos:'CDM',rating:77,age:24,cost:1150000,wage:590}];
const CLUBS=['Kingsport United','Riverside Athletic','Northcastle FC','Westbridge City','Ironport Rovers','Olympic Albion','Southbay FC','Redmont Wanderers','Crownfield AFC'];
const MAX_MATCHES=10;
const fmt=n=>'€'+Math.round(n).toLocaleString('en-US');
const compact=n=> n<0?'-€'+Math.abs(n/1e6).toFixed(2)+'M': '€'+(n/1e6).toFixed(2)+'M';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fresh=(name='Phoenix FC')=>({club:name,season:1,week:1,budget:3500000,debt:10000000,points:0,wins:0,draws:0,losses:0,goalsFor:0,goalsAgainst:0,fans:6000,morale:65,reputation:24,training:1,stadium:1,academy:1,players:structuredClone(BASE_PLAYERS),market:structuredClone(MARKET),history:[{text:'You have taken control of the club. A new era begins.',week:1,season:1}],lastMatch:null,lastEvent:null,careerScore:0,ended:false,squadUpgradeV2:true,lineup:BASE_PLAYERS.slice(0,11).map(p=>p.id),league:null,leagueHistory:[],championships:0});

const LINEUP_SLOTS=['GK','RB','CB','CB','LB','CDM','CM','CAM','LW','ST','RW'];
const TEAM_STRENGTH=[71,72,74,76,68,73,75,70,77];
function initialLineup(players){let available=[...players],ids=[];for(let pos of LINEUP_SLOTS){available.sort((a,b)=>fitRating(b,pos)-fitRating(a,pos));const p=available.shift();if(p)ids.push(p.id)}return ids}
function fitRating(p,pos){if(!p)return 0;if(p.pos===pos)return p.rating;const related={CB:['LB','RB','CDM'],LB:['RB','CB','LW'],RB:['LB','CB','RW'],CDM:['CM','CB','CAM'],CM:['CDM','CAM'],CAM:['CM','LW','RW','ST'],LW:['RW','CAM','ST'],RW:['LW','CAM','ST'],ST:['CAM','LW','RW'],GK:[]};return Math.max(20,p.rating-((related[pos]||[]).includes(p.pos)?8:24))}
function normalizeLineup(){if(!Array.isArray(state.lineup))state.lineup=initialLineup(state.players);let taken=new Set();state.lineup=LINEUP_SLOTS.map((slot,i)=>{const candidate=state.players.find(p=>p.id===Number(state.lineup[i])&&!taken.has(p.id));if(candidate){taken.add(candidate.id);return candidate.id}const unused=state.players.filter(p=>!taken.has(p.id)).sort((a,b)=>fitRating(b,slot)-fitRating(a,slot))[0];if(unused){taken.add(unused.id);return unused.id}return null})}
function lineupRating(){normalizeLineup();return Math.round(state.lineup.reduce((sum,id,i)=>sum+fitRating(state.players.find(p=>p.id===id),LINEUP_SLOTS[i]),0)/LINEUP_SLOTS.length)}
function makeSchedule(){let teams=Array.from({length:10},(_,i)=>i),rounds=[];for(let r=0;r<9;r++){const games=[];for(let i=0;i<5;i++)games.push([teams[i],teams[9-i]]);rounds.push(games);teams=[teams[0],teams[9],...teams.slice(1,9)]}rounds.push([[0,9],[1,8],[2,7],[3,6],[4,5]]);return rounds}
const SCHEDULE=makeSchedule();
function emptyClub(id,name){return {id,name,played:0,wins:0,draws:0,losses:0,gf:0,ga:0,points:0}}
function createLeague(){return {clubs:[emptyClub(0,state.club),...CLUBS.map((n,i)=>emptyClub(i+1,n))],results:[],champion:null,finalPosition:null}}
function leagueRank(){return [...state.league.clubs].sort((a,b)=>b.points-a.points||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||a.id-b.id)}
function seeded(a,b,c){let z=((a+1)*73856093^(b+1)*19349663^(c+1)*83492791)>>>0;z^=z<<13;z^=z>>>17;z^=z<<5;return (z>>>0)/4294967296}
function simulateOther(a,b,round){const ra=TEAM_STRENGTH[a-1],rb=TEAM_STRENGTH[b-1];const baseA=Math.max(.5,1.35+(ra-rb)*.07),baseB=Math.max(.5,1.35+(rb-ra)*.07);return [Math.min(5,Math.floor(seeded(state.season*97,round*13+a,b)*3+baseA*.55)),Math.min(5,Math.floor(seeded(state.season*91,round*19+b,a)*3+baseB*.55))]}
function addLeagueResult(a,b,ga,gb,round){let x=state.league.clubs[a],y=state.league.clubs[b];x.played++;y.played++;x.gf+=ga;x.ga+=gb;y.gf+=gb;y.ga+=ga;if(ga>gb){x.wins++;x.points+=3;y.losses++}else if(gb>ga){y.wins++;y.points+=3;x.losses++}else{x.draws++;y.draws++;x.points++;y.points++}state.league.results.push({round,a,b,ga,gb})}
function completeLeagueRound(ours,theirs,opponent){let round=state.week-1,games=SCHEDULE[round];for(let [a,b] of games){if(a===0||b===0){let ourHome=a===0;addLeagueResult(a,b,ourHome?ours:theirs,ourHome?theirs:ours,round+1)}else{let [ga,gb]=simulateOther(a,b,round);addLeagueResult(a,b,ga,gb,round+1)}}if(round===MAX_MATCHES-1){const ranks=leagueRank();state.league.champion=ranks[0].name;state.league.finalPosition=ranks.findIndex(t=>t.id===0)+1;if(state.league.finalPosition===1){state.championships=(state.championships||0)+1;note(`CHAMPIONS! ${state.club} win the league title!`)}else note(`${ranks[0].name} claim the Season ${state.season} title. You finished #${state.league.finalPosition}.`)}}
function fixtureOpponent(){const game=SCHEDULE[state.week-1]?.find(g=>g.includes(0));return game?state.league.clubs[game[0]===0?game[1]:game[0]].name:CLUBS[0]}
function migrateV3(){if(!state)return;if(!Array.isArray(state.leagueHistory))state.leagueHistory=[];if(!Number.isFinite(state.championships))state.championships=0;normalizeLineup();if(!state.league||!Array.isArray(state.league.clubs)){state.league=createLeague();const already=Math.min(MAX_MATCHES,Math.max(0,(state.wins||0)+(state.draws||0)+(state.losses||0)));for(let round=0;round<already;round++){for(let [a,b] of SCHEDULE[round]){if(a===0||b===0)continue;const [ga,gb]=simulateOther(a,b,round);addLeagueResult(a,b,ga,gb,round+1)}}let me=state.league.clubs[0];Object.assign(me,{played:already,wins:state.wins||0,draws:state.draws||0,losses:state.losses||0,gf:state.goalsFor||0,ga:state.goalsAgainst||0,points:state.points||0});for(let round=0;round<already;round++){const [a,b]=SCHEDULE[round].find(pair=>pair.includes(0));let opp=state.league.clubs[a===0?b:a];opp.played++;/* Old save lacks match-by-match scores: estimated opponent data only. */let ourOutcome=round<(state.wins||0)?'win':round<(state.wins||0)+(state.draws||0)?'draw':'loss';if(ourOutcome==='win'){opp.losses++;opp.ga+=2;opp.gf+=1}else if(ourOutcome==='draw'){opp.draws++;opp.points++;opp.ga++;opp.gf++}else{opp.wins++;opp.points+=3;opp.ga++;opp.gf+=2}}state.league.migrated=already>0;if(already===MAX_MATCHES){const rank=leagueRank();state.league.champion=rank[0].name;state.league.finalPosition=rank.findIndex(c=>c.id===0)+1}}save()}

function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.players)&&Number.isFinite(x.budget)){
// Upgrade saves created before the 18-player squad update without resetting achievements or transactions.
if(!x.squadUpgradeV2){const existing=new Set([...x.players,...(x.market||[])].map(p=>p.id));
for(const p of BASE_PLAYERS.filter(p=>p.id>=9)){if(!existing.has(p.id))x.players.push(structuredClone(p))}
x.squadUpgradeV2=true;localStorage.setItem(KEY,JSON.stringify(x));}
return x}}catch(e){}return null}
let state=load(),screen='dashboard',modal=null,toastTimer=0,tab='all';
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function note(text){state.history.unshift({text,week:state.week,season:state.season});state.history=state.history.slice(0,25)}
function notify(text){const old=document.querySelector('.toast');if(old)old.remove();const el=document.createElement('div');el.className='toast';el.textContent=text;document.body.append(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),3700)}
function avg(){return lineupRating()}
function wages(){return state.players.reduce((x,p)=>x+p.wage,0)}
function nextOpponent(){return fixtureOpponent()}
function winrate(){const total=state.wins+state.draws+state.losses;return total?Math.round(state.wins/total*100):0}
function icon(n){return ({dashboard:'◫',squad:'♟',transfers:'⇄',match:'⚽',facilities:'⌂',finance:'▥',history:'◷',league:'🏆',boardroom:'◆'})[n]}
function header(title,subtitle){return `<div class="sectionhead"><div><div class="eyebrow">SEASON ${state.season} / WEEK ${state.week}</div><h2 style="margin-top:8px">${title}</h2><span>${subtitle}</span></div></div>`}
function kpi(label,value,sub,warning=false){return `<div class="card"><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div><div class="kpi-sub ${warning?'warn':''}">${sub}</div></div>`}
function home(){return `<div class="hero"><div class="hero-content"><div class="eyebrow">THE CLUB IS YOURS. THE PRESSURE IS REAL.</div><h1>From the Stands<br>to the <span style="color:var(--lime)">Boardroom.</span></h1><p>Turn ${esc(state.club)} from a debt-ridden underdog into a football powerhouse. Five seasons. One legacy.</p><button class="btn primary" data-action="page" data-target="match">⚽ Play Next Match →</button></div></div><div class="kpis">${kpi('Club Budget',compact(state.budget),state.budget<500000?'Cash is running low':'Available transfer funds',state.budget<500000)}${kpi('League Points',state.points+' PTS',`${state.wins}W · ${state.draws}D · ${state.losses}L`)}${kpi('Squad Rating',avg()+' OVR',state.players.length+' first-team players')}${kpi('Outstanding Debt',compact(state.debt),state.debt===0?'Debt-free club!':'Reduce debt to increase your score',true)}</div><div class="split"><div class="card"><h3>⚽ Next Fixture</h3>${fixture()}<div class="row-between" style="margin-top:18px"><span class="small">Team morale</span><b>${state.morale}%</b></div><div class="progress"><div class="fill" style="width:${state.morale}%"></div></div><button class="btn primary" data-action="page" data-target="match" style="width:100%;margin-top:12px">Go to Match Center →</button></div><div class="card"><h3>🏆 The Five-Season Challenge</h3><p class="small" style="line-height:1.8">Build a competitive squad, pay off your debt and win the title before Season 5 ends.</p>${stat('Season completed',Math.round(((state.season-1)*MAX_MATCHES+state.week-1)/50*100),100)}${stat('Club reputation',state.reputation,100)}${stat('Fan happiness',Math.min(100,Math.round(state.fans/200)),100)}<div class="row-between" style="margin-top:22px"><span class="small">Manager score</span><b style="color:var(--lime)">${score().toLocaleString()} pts</b></div></div></div><div class="boardroom-promo"><div><div class="eyebrow">NEW · EXECUTIVE OFFICE</div><h3>THE NEXT BIG DECISION IS YOURS.</h3><p>One boardroom challenge every matchweek. Your choices shape the club.</p></div><button class="btn primary" data-action="page" data-target="boardroom">ENTER THE BOARDROOM →</button></div><div class="split"><div class="card"><div class="sectionhead"><h3 style="margin:0">Boardroom Bulletin</h3><span>Latest decisions</span></div>${activity(4)}</div><div class="card"><h3>Quick Actions</h3><div class="stack"><button class="btn secondary" data-action="page" data-target="transfers">⇄ Scout the Transfer Market</button><button class="btn secondary" data-action="page" data-target="facilities">⌂ Invest in Club Facilities</button><button class="btn secondary" data-action="page" data-target="finance">▥ Review Club Finances</button></div></div></div>`}
function stat(title,value,max){return `<div class="statline"><span>${title}</span><div class="meter"><div style="width:${Math.max(0,Math.min(100,value/max*100))}%"></div></div><b>${value}%</b></div>`}
function fixture(){return `<div class="fixture"><div class="team"><div class="team-icon">🛡️</div>${esc(state.club)}</div><div class="versus">VS<br><span style="font-size:10px">WEEK ${state.week}</span></div><div class="team"><div class="team-icon">⚔️</div>${nextOpponent()}</div></div>`}
function activity(num=30){return `<div class="activity">${state.history.slice(0,num).map(x=>`<div class="activity-row"><span>${esc(x.text)}</span><time>S${x.season} · W${x.week}</time></div>`).join('')}</div>`}
function squad(){return `${header('The Dressing Room','Your squad is the heartbeat of your club. Better players improve match results.')}<div class="kpis">${kpi('Overall Rating',avg(),'Average player rating')}${kpi('First Team',state.players.length,'Registered players')}${kpi('Weekly Wages',fmt(wages()),'Paid after each match',true)}${kpi('Team Morale',state.morale+'%','Boosted by victories and training')}</div>${lineupUI()}<div class="card"><div class="sectionhead"><h3 style="margin:0">Full Squad</h3><span>Transfer out players to free up cash</span></div><div style="overflow-x:auto"><table class="data-table"><thead><tr><th>Player</th><th>Role</th><th>Age</th><th>OVR</th><th>Market Value</th><th></th></tr></thead><tbody>${state.players.map(p=>`<tr><td><div class="player"><span class="avatar">${p.name.split(' ').map(s=>s[0]).slice(0,2).join('')}</span><b>${esc(p.name)}</b></div></td><td><span class="tag">${p.pos}</span></td><td>${p.age}</td><td><b>${p.rating}</b></td><td>${fmt(playerValue(p))}</td><td><button class="btn secondary" data-action="sell" data-id="${p.id}" ${state.players.length<=11?'disabled':''}>Sell</button></td></tr>`).join('')}</tbody></table></div></div>`}

function lineupUI(){normalizeLineup();const rows=[[8,9,10],[5,6,7],[1,2,3,4],[0]];const starters=new Set(state.lineup);const bench=state.players.filter(p=>!starters.has(p.id));return `<div class="card" style="margin-bottom:18px"><div class="sectionhead"><div><h3 style="margin:0">⚽ Starting XI · 4-3-3</h3><span>Choose your eleven. Playing a footballer out of position lowers your match rating.</span></div><span class="tag">${lineupRating()} OVR</span></div><div class="pitch">${rows.map(row=>`<div class="pitch-row">${row.map(i=>{const pos=LINEUP_SLOTS[i],p=state.players.find(x=>x.id===state.lineup[i]);return `<div class="pitch-player"><b>${pos}</b><select aria-label="Select ${pos} player" data-lineup-slot="${i}">${state.players.slice().sort((a,b)=>fitRating(b,pos)-fitRating(a,pos)).map(x=>`<option value="${x.id}" ${p&&p.id===x.id?'selected':''}>${esc(x.name.split(' ').slice(-1)[0])} (${x.rating})</option>`).join('')}</select><small>${fitRating(p,pos)} OVR${p?.pos!==pos?' ⚠':''}</small></div>`}).join('')}</div>`).join('')}</div><div class="pitch-legend"><span>🟢 Players on the pitch: ${starters.size}/11</span><span>🪑 Substitutes: ${bench.length}</span><span>⚠ Out of position = rating penalty</span></div><div class="sectionhead" style="margin:20px 0 10px"><h3 style="margin:0">Substitutes</h3><span>Available to swap into the starting XI</span></div><div style="display:flex;gap:8px;flex-wrap:wrap">${bench.map(p=>`<span class="tag">${esc(p.name)} · ${p.pos} · ${p.rating}</span>`).join('')||'<span class="small">No substitutes available.</span>'}</div><button class="btn secondary" style="margin-top:18px" data-action="bestxi">✨ Auto-select Best XI</button></div>`}
function league(){const ranks=leagueRank(),me=ranks.findIndex(c=>c.id===0)+1;const played=state.league.clubs[0].played;const champ=state.league.champion;const lastRound=state.league.results.filter(x=>x.round===played);return `${header('The Championship','Ten clubs. Ten matchdays. One title. Every result changes the table.')}<div class="kpis">${kpi('Your Position','#'+me+' / 10',me===1?'Top of the table':'Keep climbing')}${kpi('Your Points',state.league.clubs[0].points+' PTS',played+' / 10 matchdays')}${kpi('Goal Difference',String(state.goalsFor-state.goalsAgainst),(state.goalsFor)+' scored · '+(state.goalsAgainst)+' conceded')}${kpi('League Titles',String(state.championships||0),'Championships won')}</div>${champ?`<div class="champion-banner"><div class="eyebrow">🏆 SEASON ${state.season} CHAMPIONS</div><h2 style="margin:8px 0">${esc(champ)}</h2><p class="small" style="margin:0">${state.league.finalPosition===1?'Congratulations! You are league champions.':'Your club finished in position #'+state.league.finalPosition+'. Try to win the title next season.'}</p></div>`:''}<div class="card" style="margin-bottom:18px"><div class="sectionhead"><h3 style="margin:0">League Standings</h3><span>Points → goal difference → goals scored</span></div><div class="league-scroll"><table class="data-table"><thead><tr><th>POS</th><th>CLUB</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>PTS</th></tr></thead><tbody>${ranks.map((c,i)=>`<tr class="${c.id===0?'standings-highlight':''}"><td class="${i===0?'rank1':''}">${i===0?'🏆 ':''}${i+1}</td><td><b>${esc(c.name)}</b>${c.id===0?' <span class="tag">YOU</span>':''}</td><td>${c.played}</td><td>${c.wins}</td><td>${c.draws}</td><td>${c.losses}</td><td>${c.gf}</td><td>${c.ga}</td><td>${c.gf-c.ga>0?'+':''}${c.gf-c.ga}</td><td><b>${c.points}</b></td></tr>`).join('')}</tbody></table></div>${state.league.migrated?'<p class="small" style="margin-top:14px">Note: This save began before league tracking. Earlier opponent results have been estimated; all new matchdays are tracked accurately.</p>':''}</div><div class="split"><div class="card"><h3>Next Matchday · Week ${state.week}</h3>${state.lastEvent==='season'?'<p class="small">This season has finished. Start a new season to see the next fixtures.</p>':SCHEDULE[state.week-1].map(([a,b])=>`<div class="fixture-line"><span>${esc(state.league.clubs[a].name)}</span><b>vs</b><span>${esc(state.league.clubs[b].name)}</span></div>`).join('')}</div><div class="card"><h3>Latest Matchday Results</h3>${lastRound.length?lastRound.map(r=>`<div class="fixture-line"><span>${esc(state.league.clubs[r.a].name)}</span><b>${r.ga} – ${r.gb}</b><span>${esc(state.league.clubs[r.b].name)}</span></div>`).join(''):'<p class="small">Kick off your first match to see league results.</p>'}<button class="btn primary" style="width:100%;margin-top:18px" data-action="page" data-target="match">Go to Match Center →</button></div></div>${state.leagueHistory.length?`<div class="card"><h3>Previous Seasons</h3><div class="season-history">${state.leagueHistory.map(h=>`<div class="season-tile"><small>SEASON ${h.season}</small><b>${h.position===1?'🏆 CHAMPIONS':'#'+h.position+' FINISH'}</b><small>${h.points} PTS · ${esc(h.champion)} won</small></div>`).join('')}</div></div>`:''}`}

function playerValue(p){return Math.round(Math.pow(p.rating/70,4)*600000/10000)*10000}
function transfers(){let list=state.market.filter(p=>tab==='all'||p.pos===tab);return `${header('Transfer Market','Find the difference-maker. Every signing has a price.')}<div class="kpis">${kpi('Transfer Budget',compact(state.budget),'Available funds')}${kpi('Squad Rating',avg()+' OVR','Higher = better results')}${kpi('Players Available',state.market.length,'One-time transfer targets')}${kpi('Wage Bill',fmt(wages()),'Weekly expenses')}</div><div class="tabs">${['all','ST','CAM','CM','CB','GK','LW','RW','RB','LB','CDM'].map(t=>`<button class="${tab===t?'active':''}" data-action="tab" data-id="${t}">${t==='all'?'All Players':t}</button>`).join('')}</div><div class="grid3">${list.map(p=>`<div class="card player-card"><div class="row-between"><div class="tag">${p.pos}</div><span class="small">AGE ${p.age}</span></div><div class="player"><span class="avatar" style="width:52px;height:52px">${p.name.split(' ').map(s=>s[0]).slice(0,2).join('')}</span><div><b>${esc(p.name)}</b><div class="small">Potential first-team signing</div></div></div><div class="row-between"><span class="small">Overall Rating</span><b style="font-size:20px;color:var(--lime)">${p.rating}</b></div><div class="meter"><div style="width:${p.rating}%"></div></div><div class="row-between"><b class="money">${fmt(p.cost)}</b><span class="small">${fmt(p.wage)}/wk</span></div><button class="btn ${state.budget>=p.cost?'primary':'secondary'}" data-action="buy" data-id="${p.id}" ${state.budget<p.cost?'disabled':''}>${state.budget<p.cost?'Insufficient Funds':'Sign Player →'}</button></div>`).join('')||'<div class="empty">No players in this position are currently available.</div>'}</div>`}
function match(){return `${header('Match Center','Make the tactical call, then watch the result unfold.')}<div class="split"><div class="card"><h3>Upcoming League Fixture</h3>${fixture()}<div class="row-between" style="margin:18px 0"><span class="small">Your squad rating: <b>${avg()}</b></span><span class="small">Morale: <b>${state.morale}%</b></span></div><div class="row-between"><span class="small">Season progress</span><span class="small">Match ${state.week} of ${MAX_MATCHES}</span></div><div class="progress"><div class="fill" style="width:${(state.week-1)/MAX_MATCHES*100}%"></div></div><button class="btn primary" data-action="tactics" style="width:100%;margin-top:13px">⚡ Select Tactics & Kick Off</button></div><div class="card"><h3>League Form</h3><div class="kpi-value">${state.points} <span style="font-size:15px;color:var(--muted)">points</span></div><div class="small">${state.wins} Wins · ${state.draws} Draws · ${state.losses} Losses</div>${stat('Win rate',winrate(),100)}<div class="row-between" style="margin-top:30px"><span class="small">Goals scored</span><b>${state.goalsFor}</b></div><div class="row-between" style="margin-top:12px"><span class="small">Goals conceded</span><b>${state.goalsAgainst}</b></div></div></div>${state.lastMatch?`<div class="card"><h3>Previous Match</h3><div class="matchbox"><span class="small">${esc(state.lastMatch.opponent)}</span><div class="score">${state.lastMatch.ours} — ${state.lastMatch.theirs}</div><div class="big-feedback">${state.lastMatch.ours>state.lastMatch.theirs?'VICTORY':state.lastMatch.ours<state.lastMatch.theirs?'DEFEAT':'DRAW'}</div><span class="small">Tactic: ${esc(state.lastMatch.tactic)}</span></div></div>`:''}`}
const UPGRADE_META={stadium:{name:'Stadium Expansion',icon:'🏟️',description:'More seats, higher ticket revenue and faster fan growth.',base:450000},training:{name:'Training Complex',icon:'🏋️',description:'Better coaching improves player strength and morale.',base:400000},academy:{name:'Youth Academy',icon:'🌱',description:'Invest in the future. Unlock a promising youngster each season.',base:320000}};
function upgradeCost(k){return UPGRADE_META[k].base*state[k]}
function facilities(){return `${header('Club Facilities','Smart investments pay off. Build something that lasts.')}<div class="kpis">${kpi('Available Cash',compact(state.budget),'Spend wisely')}${kpi('Stadium Level',state.stadium+'/5','Ticket income multiplier')}${kpi('Training Level',state.training+'/5','Squad performance boost')}${kpi('Academy Level',state.academy+'/5','Next generation talent')}</div><div class="grid3">${Object.entries(UPGRADE_META).map(([k,v])=>`<div class="card upgrade-card"><div class="upgrade-icon">${v.icon}</div><h3 style="margin:0">${v.name}</h3><div class="upgrade-level">LEVEL ${state[k]} / 5</div><div class="meter"><div style="width:${state[k]/5*100}%"></div></div><p>${v.description}</p><div class="row-between"><span class="small">Upgrade cost</span><b class="money">${state[k]>=5?'MAXED':fmt(upgradeCost(k))}</b></div><button class="btn primary" data-action="upgrade" data-id="${k}" ${state[k]>=5||state.budget<upgradeCost(k)?'disabled':''}>${state[k]>=5?'Fully Upgraded':'Upgrade Facility →'}</button></div>`).join('')}</div>`}
function finance(){let ticket=Math.round((55000+state.fans*11)*(.7+state.stadium*.4));let sponsor=90000+state.reputation*2300;return `${header('Finance Office','Football glory means nothing if the club goes bankrupt.')}<div class="kpis">${kpi('Cash Balance',compact(state.budget),'Current reserves',state.budget<0)}${kpi('Outstanding Debt',compact(state.debt),'Original debt: €10.00M',true)}${kpi('Next Match Revenue',fmt(ticket+sponsor),'Estimated income')}${kpi('Weekly Wage Bill',fmt(wages()),'Operating expense',true)}</div><div class="split"><div class="card"><h3>Projected Matchday Cash Flow</h3><div class="finance-entry"><span>Ticket sales</span><span class="value-green">+ ${fmt(ticket)}</span></div><div class="finance-entry"><span>Sponsorship income</span><span class="value-green">+ ${fmt(sponsor)}</span></div><div class="finance-entry"><span>Player salaries</span><span class="value-red">− ${fmt(wages())}</span></div><div class="finance-entry"><span>Stadium operating expenses</span><span class="value-red">− ${fmt(40000+state.stadium*9000)}</span></div><div class="finance-entry"><b>Projected net cash flow</b><b class="money">${fmt(ticket+sponsor-wages()-(40000+state.stadium*9000))}</b></div></div><div class="card"><h3>Pay Down Club Debt</h3><p class="small" style="line-height:1.8">Every euro of debt paid brings you closer to sustainable success. Pay off your creditors to boost your final boardroom rating.</p><div class="big" style="font-size:35px;margin:22px 0;color:var(--yellow)">${compact(state.debt)}</div><button class="btn primary" style="width:100%" data-action="repay" ${state.debt<=0||state.budget<100000?'disabled':''}>Repay €500,000 (or available amount)</button><p class="small" style="margin-top:18px">Tip: Income is automatically collected after every match.</p></div></div>`}
function history(){return `${header('Boardroom Archive','Every decision builds your legacy.')}<div class="kpis">${kpi('Season',state.season+'/5','Your career journey')}${kpi('Career Score',score().toLocaleString(),'Legacy points')}${kpi('Matches Played',state.wins+state.draws+state.losses,'Since your takeover')}${kpi('Club Reputation',state.reputation+'/100','Public perception')}</div><div class="card"><h3>Club Timeline</h3>${activity(25)}</div><div class="card" style="margin-top:18px"><h3>Game Controls</h3><p class="small">Your progress saves automatically on this device. Restart only if you want a completely new challenge.</p><button class="btn danger" data-action="reset">↻ Start a New Career</button></div>`}
function score(){return state.points*25+Math.round(state.reputation*12)+state.stadium*100+state.training*100+state.academy*100+Math.floor((10000000-state.debt)/12000)+Math.round(Math.max(0,state.budget)/18000)+state.careerScore}

/* V4: weekly boardroom decision engine (local, persistent, no external API). */
const BOARDROOM_CASES=[
 {tag:'COMMERCIAL',title:'A New Shirt Sponsor',brief:'A rising tech company wants its logo on your kits. They offer a cash injection, but supporters are skeptical.',choices:[{label:'Accept the sponsorship',hint:'+€480,000 · -5 morale · +2 reputation',cash:480000,morale:-5,rep:2},{label:'Negotiate a community partnership',hint:'+€220,000 · +3 morale · +3 reputation',cash:220000,morale:3,rep:3},{label:'Protect club traditions',hint:'+7 morale · +1,000 fans',morale:7,fans:1000}]},
 {tag:'SUPPORTERS',title:'The Supporters Want Answers',brief:'The fan association is demanding lower ticket prices and a closer relationship with club leadership.',choices:[{label:'Launch affordable matchday tickets',hint:'-€160,000 · +2,200 fans · +4 reputation',cash:-160000,fans:2200,rep:4},{label:'Host a fan forum',hint:'-€60,000 · +5 morale · +700 fans',cash:-60000,morale:5,fans:700},{label:'Keep the current strategy',hint:'+€80,000 · -600 fans',cash:80000,fans:-600}]},
 {tag:'SPORTING',title:'Inside the Dressing Room',brief:'Your coaching staff has proposed an intensive week of training before a crucial fixture.',choices:[{label:'Book specialist coaches',hint:'-€180,000 · +1 to starting players rating',cash:-180000,trainingBoost:1},{label:'Organize a team retreat',hint:'-€90,000 · +10 morale',cash:-90000,morale:10},{label:'Focus on rest and recovery',hint:'+5 morale',morale:5}]},
 {tag:'COMMUNITY',title:'Your Club, Your City',brief:'The local council invites your club to support a grassroots football initiative.',choices:[{label:'Fund the full program',hint:'-€240,000 · +2,800 fans · +6 reputation',cash:-240000,fans:2800,rep:6},{label:'Send first-team ambassadors',hint:'-€55,000 · +900 fans · +3 reputation',cash:-55000,fans:900,rep:3},{label:'Decline politely',hint:'No cost · -2 reputation',rep:-2}]},
 {tag:'MEDIA',title:'The Transfer Rumour',brief:'The press claims your club lacks ambition. Reporters demand an answer before the next match.',choices:[{label:'Promise an ambitious future',hint:'+5 morale · +3 reputation · -€100,000',cash:-100000,morale:5,rep:3},{label:'Stay calm and back the team',hint:'+4 morale',morale:4},{label:'Attack the media narrative',hint:'-4 reputation · +2 morale',morale:2,rep:-4}]}
];
function boardroomCase(){return BOARDROOM_CASES[(state.season*3+state.week-4+BOARDROOM_CASES.length*5)%BOARDROOM_CASES.length]}
function boardroomDone(){return state.boardroomLast===`${state.season}-${state.week}`}
function boardroom(){const c=boardroomCase(),done=boardroomDone();return `${header('Boardroom Decisions','Real leadership happens between matchdays. Make one strategic choice per week.')}<div class="decision-hero"><div class="eyebrow">PRIVATE BOARD MEETING · ${c.tag}</div><h2>${c.title}</h2><p>${c.brief}</p><div class="decision-count">${done?'✓ Decision recorded for this matchweek':'● Awaiting your decision'} · SEASON ${state.season} / WEEK ${state.week}</div></div><div class="decision-grid">${c.choices.map((x,i)=>`<div class="card decision-card"><span class="option-number">0${i+1}</span><h3>${x.label}</h3><p>${x.hint}</p><button class="btn ${i===0?'primary':'secondary'}" data-action="decision" data-id="${i}" ${done||state.ended?'disabled':''}>${done?'DECISION CLOSED':'CHOOSE THIS OPTION →'}</button></div>`).join('')}</div><div class="card" style="margin-top:22px"><h3>📋 Your Leadership Record</h3><p class="small">Each decision has consequences. Your chosen actions appear here and in Club History.</p>${activity(6)}</div>`}
function chooseDecision(i){if(state.ended||boardroomDone())return notify('This week’s board meeting is already complete.');const c=boardroomCase(),x=c.choices[i];if(!x)return;if((x.cash||0)<0&&state.budget<Math.abs(x.cash))return notify('Not enough cash for this option. Choose a different strategy.');state.budget+=(x.cash||0);state.morale=Math.max(10,Math.min(100,state.morale+(x.morale||0)));state.reputation=Math.max(0,Math.min(100,state.reputation+(x.rep||0)));state.fans=Math.max(2000,state.fans+(x.fans||0));if(x.trainingBoost){normalizeLineup();let ids=new Set(state.lineup);state.players.forEach(p=>{if(ids.has(p.id))p.rating=Math.min(95,p.rating+1)})}state.boardroomLast=`${state.season}-${state.week}`;note(`BOARDROOM: ${x.label} — ${c.title}.`);save();render();notify('Boardroom decision confirmed. Your club has been updated!')}

function render(){document.querySelector('#overlay')?.remove();if(!state){setup();return}let titles={dashboard:'DASHBOARD',squad:'TEAM MANAGEMENT',transfers:'SCOUTING DEPARTMENT',match:'MATCHDAY',facilities:'CLUB DEVELOPMENT',finance:'FINANCIAL STRATEGY',history:'CLUB LEGACY',league:'THE CHAMPIONSHIP',boardroom:'EXECUTIVE DECISIONS'};let content={dashboard:home,squad,transfers,match,facilities,finance,league,boardroom,history};document.getElementById('app').innerHTML=`<div class="app"><aside class="sidebar"><div class="logo">THE<br><em>BOARDROOM.</em></div><div class="club-id"><div class="crest">${state.club.split(' ').map(s=>s[0]).slice(0,2).join('')}</div><div><strong>${esc(state.club)}</strong><small>MANAGER CAREER</small></div></div><div class="nav-label">CLUB MANAGEMENT</div><nav class="nav">${Object.entries({dashboard:'Dashboard',squad:'My Squad',transfers:'Transfers',match:'Match Center',facilities:'Facilities',finance:'Finances',league:'League Table',boardroom:'Boardroom Decisions',history:'Club History'}).map(([key,name])=>`<button class="${screen===key?'active':''}" data-action="page" data-target="${key}"><span>${icon(key)}</span><span class="nav-text">${name}</span></button>`).join('')}</nav><div class="sidebar-bottom">SAVE STATUS<br><b>● AUTOSAVED LOCALLY</b><br><br>A football business simulation.<br>Built for the beautiful game.</div></aside><main class="main"><div class="topbar"><div class="eyebrow">${titles[screen]}</div><div class="top-right"><div class="pill">SEASON <b>${state.season}/5</b></div><div class="pill">WEEK <b>${state.week}/${MAX_MATCHES}</b></div><button class="iconbtn" title="Game guide" data-action="help">?</button></div></div>${content[screen]()}<footer>© THE BOARDROOM · A fictional football management simulation · <b>Progress automatically saved</b></footer></main></div>`;if(modal)showModal()}
function setup(){document.getElementById('app').innerHTML=`<main style="min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at center,#214536,#081015 75%)"><div class="modal" style="max-width:560px;width:100%"><div class="eyebrow">WELCOME, CHAIRPERSON</div><div style="font-size:70px;margin:19px 0">🏟️</div><h1 style="font-size:clamp(33px,6vw,49px);line-height:1;letter-spacing:-2px;margin-bottom:13px">FROM THE STANDS<br>TO THE <span style="color:var(--lime)">BOARDROOM.</span></h1><p>You just inherited a struggling football club. You have five seasons to pay off €10 million in debt, sign stars and lead your team to glory.</p><label style="font-weight:800;font-size:12px">YOUR CLUB NAME</label><input id="clubname" class="field" value="Phoenix FC" maxlength="24" aria-label="Your club name"><button class="btn primary" id="startgame" style="width:100%;font-size:14px">TAKE OVER THE CLUB →</button><p style="text-align:center;margin:18px 0 0;font-size:11px">A fully interactive fictional football tycoon. No account needed.</p></div></main>`;document.querySelector('#startgame').onclick=()=>{let name=document.querySelector('#clubname').value.trim().slice(0,24)||'Phoenix FC';state=fresh(name);migrateV3();save();render();notify('The board has handed you the keys. Good luck, boss!')};document.querySelector('#clubname').addEventListener('keydown',e=>{if(e.key==='Enter')document.querySelector('#startgame').click()})}
function showModal(){let body='';if(modal.type==='transferConfirm'){const buying=modal.action==='buy';const p=buying?state.market.find(x=>x.id===modal.id):state.players.find(x=>x.id===modal.id);if(!p){closeModal();return}const price=buying?p.cost:playerValue(p);body=`<div class="eyebrow">TRANSFER CONFIRMATION</div><h2>${buying?'Confirm signing':'Confirm sale'}</h2><p>Are you sure you want to ${buying?'sign':'sell'} <b>${esc(p.name)}</b> (${esc(p.pos)}, ${p.rating} OVR)?</p><div class="result-summary"><div class="row-between"><span>${buying?'Transfer fee':'Sale proceeds'}</span><b class="${buying?'value-red':'value-green'}">${buying?'−':'+'}${fmt(price)}</b></div><div class="row-between" style="margin-top:12px"><span>Weekly wage ${buying?'added':'saved'}</span><b>${fmt(p.wage)}</b></div><div class="row-between" style="margin-top:12px"><span>Squad size after transfer</span><b>${state.players.length+(buying?1:-1)} players</b></div></div><div class="choice"><button data-action="dismiss">Cancel</button><button data-action="confirmtransfer" class="btn primary">${buying?'Confirm Signing':'Confirm Sale'}</button></div>`}else if(modal.type==='tactics'){body=`<div class="eyebrow">MATCHDAY DECISION</div><h2>Your tactical approach</h2><p>Choose your style of play against ${nextOpponent()}. Attacking creates more chances but opens up your defence.</p><div class="stack"><button class="btn secondary" data-action="play" data-id="defensive">🛡️ Defensive — Protect your goal</button><button class="btn secondary" data-action="play" data-id="balanced">⚖️ Balanced — Control the match</button><button class="btn primary" data-action="play" data-id="attacking">⚡ Attacking — Go for glory</button></div>`}else if(modal.type==='result'){let r=state.lastMatch;body=`<div class="eyebrow">FULL-TIME WHISTLE</div><h2>${r.ours>r.theirs?'A glorious victory!':r.ours<r.theirs?'A tough result.':'Honours even.'}</h2><div class="matchbox"><div class="small">${esc(state.club)} — ${esc(r.opponent)}</div><div class="score">${r.ours} – ${r.theirs}</div><div class="big-feedback">${r.ours>r.theirs?'THREE POINTS!':r.ours<r.theirs?'BACK TO THE DRAWING BOARD':'ONE POINT EARNED'}</div></div><div class="result-summary"><div class="row-between"><span>Matchday earnings</span><b class="value-green">+${fmt(r.revenue)}</b></div><div class="row-between" style="margin-top:12px"><span>Running costs</span><b class="value-red">−${fmt(r.costs)}</b></div><div class="row-between" style="margin-top:12px"><span>League points</span><b>+${r.points}</b></div></div><button class="btn primary" style="width:100%" data-action="dismiss">Continue Career →</button>`}else if(modal.type==='season'){body=`<div class="eyebrow">SEASON REVIEW</div><h2>${state.league.finalPosition===1?"🏆 CHAMPIONS!":"Season "+state.season+" Complete!"}</h2><p>Your club has battled through ten league matches. The board evaluates your performance before the new campaign begins.</p><div class="result-summary"><div class="row-between"><span>League position</span><b>#${state.league.finalPosition} / 10</b></div><div class="row-between" style="margin-top:10px"><span>League champions</span><b>${esc(state.league.champion)}</b></div><div class="row-between" style="margin-top:10px"><span>League points</span><b>${state.points}</b></div><div class="row-between" style="margin-top:10px"><span>Season record</span><b>${state.wins}W / ${state.draws}D / ${state.losses}L</b></div><div class="row-between" style="margin-top:10px"><span>Reputation</span><b>${state.reputation}/100</b></div></div><p>${state.points>=21?'An outstanding campaign! The supporters are dreaming big.':state.points>=14?'A respectable season. Keep building the project.':'The board expects improvement next season.'}</p><button class="btn primary" style="width:100%" data-action="nextseason">${state.season===5?'View Final Legacy':'Start Next Season →'}</button>`}else if(modal.type==='end'){body=`<div class="eyebrow">THE FINAL WHISTLE</div><h2>Your five-year legacy</h2><p>The board has completed its review of your time in charge of ${esc(state.club)}.</p><div class="matchbox"><span class="small">FINAL MANAGER RATING</span><div class="score" style="color:var(--lime)">${score().toLocaleString()}</div><div class="big-feedback">${state.debt===0&&state.reputation>=65?'CLUB LEGEND':score()>2100?'MASTER STRATEGIST':score()>1200?'PROMISING CHAIRPERSON':'REBUILD REQUIRED'}</div></div><div class="result-summary"><div class="row-between"><span>Debt remaining</span><b>${compact(state.debt)}</b></div><div class="row-between" style="margin-top:10px"><span>Career reputation</span><b>${state.reputation}/100</b></div><div class="row-between" style="margin-top:10px"><span>Total wins</span><b>${state.wins}</b></div></div><button class="btn primary" style="width:100%" data-action="dismiss">Explore Your Legacy</button>`}else if(modal.type==='confirm'){body=`<h2>Start a new career?</h2><p>This will permanently replace your current saved club. Are you sure?</p><div class="choice"><button data-action="dismiss">Cancel</button><button data-action="confirmreset">Start Fresh</button></div>`}else{body=`<h2>How to Play</h2><p><b>Goal:</b> Build the best possible football club across five seasons (10 matches per season). Your final score rewards wins, reputation, facilities, cash and debt reduction.</p><p><b>Transfers:</b> Sign better players to improve your chances in matches. Sell existing players if you need cash.</p><p><b>Matches:</b> Choose a tactical approach and receive ticket/sponsor income after each game. Results use your squad rating, training level, morale and an element of chance.</p><p><b>Facilities:</b> Expand the stadium for ticket revenue; improve training for performance; invest in your academy for future players.</p><p><b>Finance:</b> Repay club debt before your five seasons are up. Everything autosaves on this browser.</p><button class="btn primary" style="width:100%" data-action="dismiss">Let's Play</button>`}const el=document.createElement('div');el.className='modal-backdrop';el.id='overlay';el.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${body}</div>`;document.body.appendChild(el)}
function closeModal(){document.querySelector('#overlay')?.remove();modal=null}
function play(tactic){if(state.lastEvent==='season')return notify('Finish the season review first.');if(state.ended)return notify('Your five-season career is complete.');let enemy=65+((state.week*7+state.season*11)%15);let strength=lineupRating()+state.training*2+(state.morale-50)/10;let bonus={defensive:-.26,balanced:0,attacking:.36}[tactic];function goals(attack,defense){let x=Math.max(.12,1.05+(attack-defense)*.061+bonus);let outcome=0;for(let i=0;i<5;i++)if(Math.random()<Math.min(.78,x/5))outcome++;return outcome}let ours=goals(strength,enemy),theirs=goals(enemy,strength)-(tactic==='defensive'?1:0)+(tactic==='attacking'&&Math.random()<.33?1:0);theirs=Math.max(0,theirs);let pts=ours>theirs?3:ours===theirs?1:0;let ticket=Math.round((55000+state.fans*11)*(.7+state.stadium*.4));let sponsor=90000+state.reputation*2300;let rev=ticket+sponsor;let costs=wages()+40000+state.stadium*9000;state.budget+=rev-costs;state.points+=pts;state.goalsFor+=ours;state.goalsAgainst+=theirs;if(pts===3){state.wins++;state.morale=Math.min(100,state.morale+7);state.fans+=800+state.stadium*150;state.reputation=Math.min(100,state.reputation+3)}else if(pts===1){state.draws++;state.morale=Math.min(100,state.morale+1);state.fans+=120;state.reputation=Math.min(100,state.reputation+1)}else{state.losses++;state.morale=Math.max(15,state.morale-5);state.fans=Math.max(2000,state.fans-240);state.reputation=Math.max(10,state.reputation-1)}let opponent=nextOpponent();completeLeagueRound(ours,theirs,opponent);state.lastMatch={ours,theirs,opponent,points:pts,revenue:rev,costs,tactic:tactic[0].toUpperCase()+tactic.slice(1)};note(`${state.club} ${ours}–${theirs} ${opponent} · ${pts} league points`);state.week++;let end=state.week>MAX_MATCHES;if(end)state.week=MAX_MATCHES;save();closeModal();modal={type:'result'};render();if(end)state.lastEvent='season'}
function nextSeason(){closeModal();if(state.season>=5){state.ended=true;note('Your five-season career has concluded.');save();modal={type:'end'};render();return}let previous=state.season;state.leagueHistory.unshift({season:previous,position:state.league.finalPosition||leagueRank().findIndex(x=>x.id===0)+1,champion:state.league.champion||leagueRank()[0].name,points:state.points});let prize=Math.round((state.points/30)*950000+150000);state.budget+=prize;note(`Season ${previous} prize money: ${fmt(prize)}.`);state.season++;state.league=createLeague();state.week=1;state.points=0;state.wins=0;state.draws=0;state.losses=0;state.goalsFor=0;state.goalsAgainst=0;state.morale=Math.min(100,state.morale+5);if(state.academy>=2){let id=200+state.season;let talent={id,name:['Kai Jensen','Aiden Clarke','Marco Bianchi','Isaac Novak'][state.season-2],pos:['CM','ST','CB','LW'][state.season-2],rating:65+state.academy*3+state.season,age:18,wage:200};state.players.push(talent);normalizeLineup();note(`Academy breakthrough! ${talent.name} joins your squad.`)}note(`Season ${state.season} begins. The board expects progress.`);state.lastEvent=null;state.lastMatch=null;screen='dashboard';save();render();notify(`Season ${state.season} has started. Prize money: ${fmt(prize)}`)}
function transact(action,id){if(action==='buy'){let p=state.market.find(p=>p.id==id);if(!p)return;if(state.budget<p.cost)return notify('Insufficient transfer funds.');state.budget-=p.cost;state.players.push(p);normalizeLineup();state.market=state.market.filter(x=>x.id!==p.id);state.reputation=Math.min(100,state.reputation+1);note(`Signed ${p.name} for ${fmt(p.cost)}.`);notify(`${p.name} has signed for ${state.club}!`)}if(action==='sell'){let p=state.players.find(p=>p.id==id);if(!p||state.players.length<=11)return notify('You must keep at least 11 players in your squad.');let amount=playerValue(p);state.budget+=amount;state.players=state.players.filter(x=>x.id!==p.id);normalizeLineup();state.morale=Math.max(10,state.morale-2);note(`Sold ${p.name} for ${fmt(amount)}.`);notify(`${p.name} sold for ${fmt(amount)}.`)}if(action==='upgrade'){if(!UPGRADE_META[id]||state[id]>=5||state.budget<upgradeCost(id))return;let price=upgradeCost(id);state.budget-=price;state[id]++;if(id==='training'){state.morale=Math.min(100,state.morale+4);state.players=state.players.map(p=>({...p,rating:Math.min(95,p.rating+1)}))}note(`${UPGRADE_META[id].name} upgraded to Level ${state[id]}.`);notify(`${UPGRADE_META[id].name} upgraded!`)}if(action==='repay'){let amount=Math.min(500000,state.debt,Math.floor(state.budget/100000)*100000);if(amount<100000)return;state.budget-=amount;state.debt-=amount;state.reputation=Math.min(100,state.reputation+2);note(`Paid ${fmt(amount)} toward outstanding club debt.`);notify(`${fmt(amount)} repaid. Strong financial leadership!`)}save();render()}
document.addEventListener('change',e=>{const select=e.target.closest('[data-lineup-slot]');if(!select||!state||state.ended)return;const slot=Number(select.dataset.lineupSlot),id=Number(select.value),other=state.lineup.findIndex((p,i)=>i!==slot&&p===id);if(other!==-1)state.lineup[other]=state.lineup[slot];state.lineup[slot]=id;normalizeLineup();save();render();notify('Starting XI updated — ready for matchday!')});
document.addEventListener('click',e=>{let btn=e.target.closest('[data-action]');if(!btn)return;let action=btn.dataset.action,id=btn.dataset.id;if(action==='decision'){chooseDecision(Number(id))}else if(action==='page'){closeModal();screen=btn.dataset.target;render();window.scrollTo(0,0)}else if(action==='tab'){tab=id;render()}else if(action==='bestxi'){state.lineup=initialLineup(state.players);save();render();notify('Best XI selected!')}else if(['buy','sell','upgrade','repay'].includes(action)){if(state.ended)return notify('Career complete. Start a new save to play again.');if(action==='buy'||action==='sell'){modal={type:'transferConfirm',action,id:Number(id)};render()}else transact(action,id)}else if(action==='confirmtransfer'){if(modal?.type!=='transferConfirm')return;const requestedAction=modal.action,requestedId=modal.id;closeModal();transact(requestedAction,requestedId)}else if(action==='tactics'){if(state.ended)return notify('Your career has ended.');modal=state.lastEvent==='season'?{type:'season'}:{type:'tactics'};render()}else if(action==='play'){play(id)}else if(action==='dismiss'){let endedMatch=modal?.type==='result'&&state.lastEvent==='season';closeModal();if(endedMatch){modal={type:'season'};render()}else render()}else if(action==='nextseason')nextSeason();else if(action==='help'){modal={type:'help'};render()}else if(action==='reset'){modal={type:'confirm'};render()}else if(action==='confirmreset'){localStorage.removeItem(KEY);state=null;modal=null;document.querySelector('#overlay')?.remove();setup()}});
migrateV3();render();
</script></body></html>
