<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{--bg:#081015;--panel:#111d24;--panel2:#15252c;--line:#273a42;--text:#eef8f4;--muted:#91a4a8;--lime:#b8f35d;--green:#6de8a1;--yellow:#ffd37a;--red:#ff7c82;--radius:18px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.38;cursor:not-allowed}h1,h2,h3,h4,p{margin-top:0}h1,h2,h3,.brand,.big{font-family:'Space Grotesk',sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.sidebar{background:#0c171d;border-right:1px solid var(--line);padding:26px 16px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh}.logo{font-weight:800;letter-spacing:-1.1px;font-size:24px;line-height:1.05;padding:0 13px}.logo em{font-style:normal;color:var(--lime)}.club-id{margin:0 9px;background:#15262b;border:1px solid #314944;border-radius:14px;padding:13px;display:flex;align-items:center;gap:11px}.crest{width:42px;height:48px;background:var(--lime);color:#0b1714;display:grid;place-items:center;clip-path:polygon(50% 0%,96% 16%,91% 68%,50% 100%,9% 68%,4% 16%);font-weight:900;font-size:18px}.club-id strong{display:block;font-size:13px}.club-id small{display:block;font-size:11px;color:var(--muted);margin-top:4px}.nav-label{padding:0 15px;color:#607a81;font-size:10px;letter-spacing:2px;font-weight:800}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#9cb0b4;padding:12px 15px;text-align:left;border-radius:11px;display:flex;align-items:center;gap:12px;font-weight:700;font-size:13px}.nav button:hover,.nav button.active{background:#20332d;color:var(--lime)}.nav button span{font-size:18px;width:22px;text-align:center}.sidebar-bottom{margin-top:auto;padding:15px;color:var(--muted);font-size:11px;border-top:1px solid var(--line);line-height:1.7}.sidebar-bottom b{color:var(--lime)}.main{min-width:0;padding:30px clamp(20px,4vw,60px);max-width:1540px;width:100%;margin:auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:30px}.eyebrow{color:var(--lime);text-transform:uppercase;letter-spacing:2.3px;font-size:11px;font-weight:800}.top-right{display:flex;gap:10px;align-items:center}.pill{background:#16262d;border:1px solid #294049;border-radius:100px;padding:9px 13px;color:#c9d9d6;font-size:12px;font-weight:700}.pill b{color:var(--lime)}.iconbtn{border:1px solid var(--line);background:#18262c;color:var(--text);border-radius:9px;padding:9px 12px}.hero{position:relative;border:1px solid #344d3c;border-radius:22px;background:radial-gradient(ellipse at 83% 100%,#356b42 0%,transparent 54%),linear-gradient(120deg,#1c3b34,#102229 65%,#152d2a);padding:35px 38px;overflow:hidden;min-height:235px;display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:23px}.hero:after{content:'⚽';font-size:185px;position:absolute;right:65px;top:7px;opacity:.11;transform:rotate(-20deg)}.hero-content{position:relative;z-index:1}.hero h1{font-size:clamp(26px,3.6vw,49px);line-height:1.05;letter-spacing:-2px;max-width:680px;margin:10px 0 12px}.hero p{color:#b5d0c4;font-size:14px;max-width:540px;line-height:1.6;margin:0}.btn{border-radius:10px;border:1px solid transparent;padding:12px 17px;font-weight:800;font-size:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,filter .12s}.btn:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.1)}.primary{background:var(--lime);color:#101a13}.secondary{background:#1c3034;color:#e3f6e8;border-color:#345047}.danger{background:#3b222a;color:#ffa6a8;border-color:#6d3943}.hero .btn{margin-top:20px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}.sectionhead h2{font-size:23px;letter-spacing:-.7px;margin:0}.sectionhead span,.hint{color:var(--muted);font-size:12px}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:24px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:21px;min-width:0}.kpi-label{color:var(--muted);font-size:12px;font-weight:700}.kpi-value{font-family:'Space Grotesk';font-size:clamp(23px,2.5vw,36px);font-weight:700;letter-spacing:-1.2px;margin:12px 0 6px}.kpi-sub{font-size:11px;color:var(--green)}.kpi-sub.warn{color:var(--yellow)}.split{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-bottom:22px}.card h3{font-size:16px;margin:0 0 18px}.fixture{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:19px;background:var(--panel2);border-radius:13px}.team{text-align:center;flex:1;font-size:12px;font-weight:800}.team-icon{width:55px;height:55px;border:1px solid #3c5d4c;border-radius:15px;display:grid;place-items:center;font-size:24px;margin:0 auto 10px;background:#20382f}.versus{font-size:13px;color:var(--muted);font-weight:800}.progress{height:8px;background:#273b3f;border-radius:50px;overflow:hidden;margin:14px 0}.fill{height:100%;border-radius:50px;background:linear-gradient(90deg,#72b64d,var(--lime))}.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px}.small{font-size:12px;color:var(--muted)}.activity{display:grid;gap:9px}.activity-row{padding:11px 13px;background:var(--panel2);border-radius:10px;display:flex;justify-content:space-between;gap:15px;font-size:12px}.activity-row time{color:#7e979d;font-size:11px;white-space:nowrap}.data-table{width:100%;border-collapse:collapse;text-align:left}.data-table th{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#78949b;padding:12px;border-bottom:1px solid var(--line)}.data-table td{font-size:12px;border-bottom:1px solid #24363d;padding:14px 12px}.data-table tr:last-child td{border-bottom:0}.tag{display:inline-flex;align-items:center;padding:5px 9px;border-radius:50px;font-size:10px;font-weight:800;background:#203c32;color:var(--lime)}.tag.red{color:#ffa1a6;background:#3e282e}.tag.yellow{color:var(--yellow);background:#443c2c}.stack{display:grid;gap:18px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.player{display:flex;align-items:center;gap:12px}.avatar{background:#264138;border:1px solid #3b6250;color:var(--lime);height:40px;width:40px;border-radius:12px;display:grid;place-items:center;font-weight:800}.money{color:var(--lime);font-weight:800}.muted{color:var(--muted)}.player-card{display:flex;flex-direction:column;gap:12px}.player-card .btn{width:100%}.meter{height:7px;background:#293d43;border-radius:8px;overflow:hidden}.meter>div{height:100%;background:var(--lime)}.upgrade-icon{font-size:34px;margin-bottom:4px}.upgrade-level{color:var(--lime);font-weight:800;font-size:12px}.upgrade-card{display:flex;flex-direction:column;gap:11px}.upgrade-card p{font-size:12px;color:var(--muted);line-height:1.6;flex:1;margin:0}.finance-entry{border-bottom:1px solid var(--line);padding:14px 0;display:flex;justify-content:space-between;font-size:13px}.finance-entry:last-child{border-bottom:0}.value-green{color:var(--green);font-weight:800}.value-red{color:var(--red);font-weight:800}.matchbox{text-align:center;padding:25px;background:#152a2a;border:1px solid #385848;border-radius:16px}.score{font-family:'Space Grotesk';font-size:52px;letter-spacing:2px;font-weight:800}.big-feedback{font-size:19px;font-weight:800;margin:9px 0}.match-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.story{padding:11px 15px;border-left:2px solid var(--lime);color:#c9d9d6;background:#1a302e;font-size:12px;text-align:left;margin:9px auto;max-width:460px;border-radius:0 7px 7px 0}.toast{position:fixed;bottom:22px;right:24px;background:#264231;color:#ddffd6;border:1px solid #70b571;padding:15px 20px;border-radius:12px;box-shadow:0 20px 60px #0007;max-width:360px;z-index:50;font-size:13px;font-weight:700}.modal-backdrop{position:fixed;inset:0;background:#010609da;display:grid;place-items:center;padding:20px;z-index:30}.modal{background:#15252b;border:1px solid #44614c;border-radius:24px;padding:32px;width:min(500px,100%);box-shadow:0 30px 100px #0008}.modal h2{font-size:29px;letter-spacing:-1px}.modal p{font-size:13px;color:#a7c0b9;line-height:1.7}.field{width:100%;padding:13px;background:#0d191f;border:1px solid #3c514e;border-radius:10px;color:var(--text);outline:none;margin:10px 0 18px}.field:focus{border-color:var(--lime)}.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice button{background:#203832;border:1px solid #41654e;padding:13px;color:#d1f4dc;border-radius:10px;font-weight:800}.choice button:hover{background:#335c42}.result-summary{background:#203830;border-radius:12px;padding:15px;margin:18px 0}.empty{color:var(--muted);font-size:13px;padding:20px 0}.hide{display:none!important}footer{font-size:11px;color:#607880;margin-top:28px}footer b{color:#91bda0}.statline{display:flex;gap:12px;align-items:center;font-size:12px;margin-top:12px}.statline>span:first-child{width:85px;color:var(--muted)}.statline .meter{flex:1}.statline>b{width:26px;text-align:right}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.tabs button{border:1px solid var(--line);background:var(--panel);color:#a6b9b9;border-radius:10px;padding:10px 14px;font-weight:800;font-size:12px}.tabs button.active{background:#2f4c39;color:var(--lime);border-color:#6e996a}@media(max-width:1060px){.app{grid-template-columns:74px 1fr}.sidebar{padding:24px 8px}.logo{font-size:13px;padding:0 5px}.club-id,.nav-label,.nav button .nav-text,.sidebar-bottom{display:none}.nav button{justify-content:center;padding:13px}.nav button span{width:auto}.main{padding:26px}.kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.app{display:block}.sidebar{height:auto;position:static;padding:12px;flex-direction:row;align-items:center;border-right:0;border-bottom:1px solid var(--line);gap:7px;overflow:auto}.logo{min-width:88px}.nav{display:flex;gap:3px}.nav button{min-width:44px}.main{padding:18px}.topbar{align-items:flex-start}.top-right{gap:5px;flex-wrap:wrap;justify-content:flex-end}.pill{font-size:10px;padding:8px}.hero{padding:25px;min-height:220px}.hero:after{right:0;font-size:130px}.hero h1{letter-spacing:-1px}.split,.grid2,.grid3{grid-template-columns:1fr}.kpis{gap:10px}.card{padding:16px}.kpi-value{font-size:26px}.data-table th,.data-table td{padding:10px 6px;font-size:10px}.optional-mobile{display:none}.modal{padding:23px}}
</style>
</head><body><div id="app"></div><script>
'use strict';
const KEY='boardroom-save-v1';
const BASE_PLAYERS=[{id:1,name:'Alex Morgan',pos:'ST',rating:71,age:23,wage:450},{id:2,name:'Leo Fernández',pos:'CAM',rating:73,age:25,wage:510},{id:3,name:'Noah Fischer',pos:'CM',rating:69,age:22,wage:350},{id:4,name:'Milan De Vries',pos:'CB',rating:72,age:27,wage:480},{id:5,name:'Oliver Hart',pos:'GK',rating:70,age:26,wage:390},{id:6,name:'Luca Rossi',pos:'LW',rating:68,age:20,wage:310},{id:7,name:'Sam Bennett',pos:'RB',rating:67,age:24,wage:280},{id:8,name:'Mateo Silva',pos:'CDM',rating:70,age:28,wage:400}];
const MARKET=[{id:101,name:'Ethan Brooks',pos:'ST',rating:82,age:24,cost:2200000,wage:1100},{id:102,name:'Thiago Costa',pos:'CAM',rating:79,age:22,cost:1600000,wage:850},{id:103,name:'Jonas Weber',pos:'CB',rating:81,age:25,cost:1900000,wage:900},{id:104,name:'Emil Sørensen',pos:'GK',rating:78,age:23,cost:1250000,wage:700},{id:105,name:'Rafael Mendes',pos:'LW',rating:76,age:21,cost:990000,wage:580},{id:106,name:'James Okafor',pos:'CM',rating:75,age:19,cost:890000,wage:470},{id:107,name:'Victor Moreau',pos:'RB',rating:80,age:26,cost:1750000,wage:830},{id:108,name:'Finn Walker',pos:'CDM',rating:77,age:24,cost:1150000,wage:590}];
const CLUBS=['Kingsport United','Riverside Athletic','Northcastle FC','Westbridge City','Ironport Rovers','Olympic Albion','Southbay FC','Redmont Wanderers','Crownfield AFC'];
const MAX_MATCHES=10;
const fmt=n=>'€'+Math.round(n).toLocaleString('en-US');
const compact=n=> n<0?'-€'+Math.abs(n/1e6).toFixed(2)+'M': '€'+(n/1e6).toFixed(2)+'M';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fresh=(name='Phoenix FC')=>({club:name,season:1,week:1,budget:3500000,debt:10000000,points:0,wins:0,draws:0,losses:0,goalsFor:0,goalsAgainst:0,fans:6000,morale:65,reputation:24,training:1,stadium:1,academy:1,players:structuredClone(BASE_PLAYERS),market:structuredClone(MARKET),history:[{text:'You have taken control of the club. A new era begins.',week:1,season:1}],lastMatch:null,lastEvent:null,careerScore:0,ended:false});
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.players)&&Number.isFinite(x.budget))return x}catch(e){}return null}
let state=load(),screen='dashboard',modal=null,toastTimer=0,tab='all';
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function note(text){state.history.unshift({text,week:state.week,season:state.season});state.history=state.history.slice(0,25)}
function notify(text){const old=document.querySelector('.toast');if(old)old.remove();const el=document.createElement('div');el.className='toast';el.textContent=text;document.body.append(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),3700)}
function avg(){return Math.round(state.players.reduce((x,p)=>x+p.rating,0)/state.players.length)}
function wages(){return state.players.reduce((x,p)=>x+p.wage,0)}
function nextOpponent(){return CLUBS[(state.week-1+(state.season-1)*3)%CLUBS.length]}
function winrate(){const total=state.wins+state.draws+state.losses;return total?Math.round(state.wins/total*100):0}
function icon(n){return ({dashboard:'◫',squad:'♟',transfers:'⇄',match:'⚽',facilities:'⌂',finance:'▥',history:'◷'})[n]}
function header(title,subtitle){return `<div class="sectionhead"><div><div class="eyebrow">SEASON ${state.season} / WEEK ${state.week}</div><h2 style="margin-top:8px">${title}</h2><span>${subtitle}</span></div></div>`}
function kpi(label,value,sub,warning=false){return `<div class="card"><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div><div class="kpi-sub ${warning?'warn':''}">${sub}</div></div>`}
function home(){return `<div class="hero"><div class="hero-content"><div class="eyebrow">THE CLUB IS YOURS. THE PRESSURE IS REAL.</div><h1>From the Stands<br>to the <span style="color:var(--lime)">Boardroom.</span></h1><p>Turn ${esc(state.club)} from a debt-ridden underdog into a football powerhouse. Five seasons. One legacy.</p><button class="btn primary" data-action="page" data-target="match">⚽ Play Next Match →</button></div></div><div class="kpis">${kpi('Club Budget',compact(state.budget),state.budget<500000?'Cash is running low':'Available transfer funds',state.budget<500000)}${kpi('League Points',state.points+' PTS',`${state.wins}W · ${state.draws}D · ${state.losses}L`)}${kpi('Squad Rating',avg()+' OVR',state.players.length+' first-team players')}${kpi('Outstanding Debt',compact(state.debt),state.debt===0?'Debt-free club!':'Reduce debt to increase your score',true)}</div><div class="split"><div class="card"><h3>⚽ Next Fixture</h3>${fixture()}<div class="row-between" style="margin-top:18px"><span class="small">Team morale</span><b>${state.morale}%</b></div><div class="progress"><div class="fill" style="width:${state.morale}%"></div></div><button class="btn primary" data-action="page" data-target="match" style="width:100%;margin-top:12px">Go to Match Center →</button></div><div class="card"><h3>🏆 The Five-Season Challenge</h3><p class="small" style="line-height:1.8">Build a competitive squad, pay off your debt and win the title before Season 5 ends.</p>${stat('Season completed',Math.round(((state.season-1)*MAX_MATCHES+state.week-1)/50*100),100)}${stat('Club reputation',state.reputation,100)}${stat('Fan happiness',Math.min(100,Math.round(state.fans/200)),100)}<div class="row-between" style="margin-top:22px"><span class="small">Manager score</span><b style="color:var(--lime)">${score().toLocaleString()} pts</b></div></div></div><div class="split"><div class="card"><div class="sectionhead"><h3 style="margin:0">Boardroom Bulletin</h3><span>Latest decisions</span></div>${activity(4)}</div><div class="card"><h3>Quick Actions</h3><div class="stack"><button class="btn secondary" data-action="page" data-target="transfers">⇄ Scout the Transfer Market</button><button class="btn secondary" data-action="page" data-target="facilities">⌂ Invest in Club Facilities</button><button class="btn secondary" data-action="page" data-target="finance">▥ Review Club Finances</button></div></div></div>`}
function stat(title,value,max){return `<div class="statline"><span>${title}</span><div class="meter"><div style="width:${Math.max(0,Math.min(100,value/max*100))}%"></div></div><b>${value}%</b></div>`}
function fixture(){return `<div class="fixture"><div class="team"><div class="team-icon">🛡️</div>${esc(state.club)}</div><div class="versus">VS<br><span style="font-size:10px">WEEK ${state.week}</span></div><div class="team"><div class="team-icon">⚔️</div>${nextOpponent()}</div></div>`}
function activity(num=30){return `<div class="activity">${state.history.slice(0,num).map(x=>`<div class="activity-row"><span>${esc(x.text)}</span><time>S${x.season} · W${x.week}</time></div>`).join('')}</div>`}
function squad(){return `${header('The Dressing Room','Your squad is the heartbeat of your club. Better players improve match results.')}<div class="kpis">${kpi('Overall Rating',avg(),'Average player rating')}${kpi('First Team',state.players.length,'Registered players')}${kpi('Weekly Wages',fmt(wages()),'Paid after each match',true)}${kpi('Team Morale',state.morale+'%','Boosted by victories and training')}</div><div class="card"><div class="sectionhead"><h3 style="margin:0">First Team Squad</h3><span>Transfer out players to free up cash</span></div><div style="overflow-x:auto"><table class="data-table"><thead><tr><th>Player</th><th>Role</th><th>Age</th><th>OVR</th><th>Market Value</th><th></th></tr></thead><tbody>${state.players.map(p=>`<tr><td><div class="player"><span class="avatar">${p.name.split(' ').map(s=>s[0]).slice(0,2).join('')}</span><b>${esc(p.name)}</b></div></td><td><span class="tag">${p.pos}</span></td><td>${p.age}</td><td><b>${p.rating}</b></td><td>${fmt(playerValue(p))}</td><td><button class="btn secondary" data-action="sell" data-id="${p.id}" ${state.players.length<=5?'disabled':''}>Sell</button></td></tr>`).join('')}</tbody></table></div></div>`}
function playerValue(p){return Math.round(Math.pow(p.rating/70,4)*600000/10000)*10000}
function transfers(){let list=state.market.filter(p=>tab==='all'||p.pos===tab);return `${header('Transfer Market','Find the difference-maker. Every signing has a price.')}<div class="kpis">${kpi('Transfer Budget',compact(state.budget),'Available funds')}${kpi('Squad Rating',avg()+' OVR','Higher = better results')}${kpi('Players Available',state.market.length,'One-time transfer targets')}${kpi('Wage Bill',fmt(wages()),'Weekly expenses')}</div><div class="tabs">${['all','ST','CAM','CM','CB','GK','LW','RB','CDM'].map(t=>`<button class="${tab===t?'active':''}" data-action="tab" data-id="${t}">${t==='all'?'All Players':t}</button>`).join('')}</div><div class="grid3">${list.map(p=>`<div class="card player-card"><div class="row-between"><div class="tag">${p.pos}</div><span class="small">AGE ${p.age}</span></div><div class="player"><span class="avatar" style="width:52px;height:52px">${p.name.split(' ').map(s=>s[0]).slice(0,2).join('')}</span><div><b>${esc(p.name)}</b><div class="small">Potential first-team signing</div></div></div><div class="row-between"><span class="small">Overall Rating</span><b style="font-size:20px;color:var(--lime)">${p.rating}</b></div><div class="meter"><div style="width:${p.rating}%"></div></div><div class="row-between"><b class="money">${fmt(p.cost)}</b><span class="small">${fmt(p.wage)}/wk</span></div><button class="btn ${state.budget>=p.cost?'primary':'secondary'}" data-action="buy" data-id="${p.id}" ${state.budget<p.cost?'disabled':''}>${state.budget<p.cost?'Insufficient Funds':'Sign Player →'}</button></div>`).join('')||'<div class="empty">No players in this position are currently available.</div>'}</div>`}
function match(){return `${header('Match Center','Make the tactical call, then watch the result unfold.')}<div class="split"><div class="card"><h3>Upcoming League Fixture</h3>${fixture()}<div class="row-between" style="margin:18px 0"><span class="small">Your squad rating: <b>${avg()}</b></span><span class="small">Morale: <b>${state.morale}%</b></span></div><div class="row-between"><span class="small">Season progress</span><span class="small">Match ${state.week} of ${MAX_MATCHES}</span></div><div class="progress"><div class="fill" style="width:${(state.week-1)/MAX_MATCHES*100}%"></div></div><button class="btn primary" data-action="tactics" style="width:100%;margin-top:13px">⚡ Select Tactics & Kick Off</button></div><div class="card"><h3>League Form</h3><div class="kpi-value">${state.points} <span style="font-size:15px;color:var(--muted)">points</span></div><div class="small">${state.wins} Wins · ${state.draws} Draws · ${state.losses} Losses</div>${stat('Win rate',winrate(),100)}<div class="row-between" style="margin-top:30px"><span class="small">Goals scored</span><b>${state.goalsFor}</b></div><div class="row-between" style="margin-top:12px"><span class="small">Goals conceded</span><b>${state.goalsAgainst}</b></div></div></div>${state.lastMatch?`<div class="card"><h3>Previous Match</h3><div class="matchbox"><span class="small">${esc(state.lastMatch.opponent)}</span><div class="score">${state.lastMatch.ours} — ${state.lastMatch.theirs}</div><div class="big-feedback">${state.lastMatch.ours>state.lastMatch.theirs?'VICTORY':state.lastMatch.ours<state.lastMatch.theirs?'DEFEAT':'DRAW'}</div><span class="small">Tactic: ${esc(state.lastMatch.tactic)}</span></div></div>`:''}`}
const UPGRADE_META={stadium:{name:'Stadium Expansion',icon:'🏟️',description:'More seats, higher ticket revenue and faster fan growth.',base:450000},training:{name:'Training Complex',icon:'🏋️',description:'Better coaching improves player strength and morale.',base:400000},academy:{name:'Youth Academy',icon:'🌱',description:'Invest in the future. Unlock a promising youngster each season.',base:320000}};
function upgradeCost(k){return UPGRADE_META[k].base*state[k]}
function facilities(){return `${header('Club Facilities','Smart investments pay off. Build something that lasts.')}<div class="kpis">${kpi('Available Cash',compact(state.budget),'Spend wisely')}${kpi('Stadium Level',state.stadium+'/5','Ticket income multiplier')}${kpi('Training Level',state.training+'/5','Squad performance boost')}${kpi('Academy Level',state.academy+'/5','Next generation talent')}</div><div class="grid3">${Object.entries(UPGRADE_META).map(([k,v])=>`<div class="card upgrade-card"><div class="upgrade-icon">${v.icon}</div><h3 style="margin:0">${v.name}</h3><div class="upgrade-level">LEVEL ${state[k]} / 5</div><div class="meter"><div style="width:${state[k]/5*100}%"></div></div><p>${v.description}</p><div class="row-between"><span class="small">Upgrade cost</span><b class="money">${state[k]>=5?'MAXED':fmt(upgradeCost(k))}</b></div><button class="btn primary" data-action="upgrade" data-id="${k}" ${state[k]>=5||state.budget<upgradeCost(k)?'disabled':''}>${state[k]>=5?'Fully Upgraded':'Upgrade Facility →'}</button></div>`).join('')}</div>`}
function finance(){let ticket=Math.round((55000+state.fans*11)*(.7+state.stadium*.4));let sponsor=90000+state.reputation*2300;return `${header('Finance Office','Football glory means nothing if the club goes bankrupt.')}<div class="kpis">${kpi('Cash Balance',compact(state.budget),'Current reserves',state.budget<0)}${kpi('Outstanding Debt',compact(state.debt),'Original debt: €10.00M',true)}${kpi('Next Match Revenue',fmt(ticket+sponsor),'Estimated income')}${kpi('Weekly Wage Bill',fmt(wages()),'Operating expense',true)}</div><div class="split"><div class="card"><h3>Projected Matchday Cash Flow</h3><div class="finance-entry"><span>Ticket sales</span><span class="value-green">+ ${fmt(ticket)}</span></div><div class="finance-entry"><span>Sponsorship income</span><span class="value-green">+ ${fmt(sponsor)}</span></div><div class="finance-entry"><span>Player salaries</span><span class="value-red">− ${fmt(wages())}</span></div><div class="finance-entry"><span>Stadium operating expenses</span><span class="value-red">− ${fmt(40000+state.stadium*9000)}</span></div><div class="finance-entry"><b>Projected net cash flow</b><b class="money">${fmt(ticket+sponsor-wages()-(40000+state.stadium*9000))}</b></div></div><div class="card"><h3>Pay Down Club Debt</h3><p class="small" style="line-height:1.8">Every euro of debt paid brings you closer to sustainable success. Pay off your creditors to boost your final boardroom rating.</p><div class="big" style="font-size:35px;margin:22px 0;color:var(--yellow)">${compact(state.debt)}</div><button class="btn primary" style="width:100%" data-action="repay" ${state.debt<=0||state.budget<100000?'disabled':''}>Repay €500,000 (or available amount)</button><p class="small" style="margin-top:18px">Tip: Income is automatically collected after every match.</p></div></div>`}
function history(){return `${header('Boardroom Archive','Every decision builds your legacy.')}<div class="kpis">${kpi('Season',state.season+'/5','Your career journey')}${kpi('Career Score',score().toLocaleString(),'Legacy points')}${kpi('Matches Played',state.wins+state.draws+state.losses,'Since your takeover')}${kpi('Club Reputation',state.reputation+'/100','Public perception')}</div><div class="card"><h3>Club Timeline</h3>${activity(25)}</div><div class="card" style="margin-top:18px"><h3>Game Controls</h3><p class="small">Your progress saves automatically on this device. Restart only if you want a completely new challenge.</p><button class="btn danger" data-action="reset">↻ Start a New Career</button></div>`}
function score(){return state.points*25+Math.round(state.reputation*12)+state.stadium*100+state.training*100+state.academy*100+Math.floor((10000000-state.debt)/12000)+Math.round(Math.max(0,state.budget)/18000)+state.careerScore}
function render(){document.querySelector('#overlay')?.remove();if(!state){setup();return}let titles={dashboard:'DASHBOARD',squad:'TEAM MANAGEMENT',transfers:'SCOUTING DEPARTMENT',match:'MATCHDAY',facilities:'CLUB DEVELOPMENT',finance:'FINANCIAL STRATEGY',history:'CLUB LEGACY'};let content={dashboard:home,squad,transfers,match,facilities,finance,history};document.getElementById('app').innerHTML=`<div class="app"><aside class="sidebar"><div class="logo">THE<br><em>BOARDROOM.</em></div><div class="club-id"><div class="crest">${state.club.split(' ').map(s=>s[0]).slice(0,2).join('')}</div><div><strong>${esc(state.club)}</strong><small>MANAGER CAREER</small></div></div><div class="nav-label">CLUB MANAGEMENT</div><nav class="nav">${Object.entries({dashboard:'Dashboard',squad:'My Squad',transfers:'Transfers',match:'Match Center',facilities:'Facilities',finance:'Finances',history:'Club History'}).map(([key,name])=>`<button class="${screen===key?'active':''}" data-action="page" data-target="${key}"><span>${icon(key)}</span><span class="nav-text">${name}</span></button>`).join('')}</nav><div class="sidebar-bottom">SAVE STATUS<br><b>● AUTOSAVED LOCALLY</b><br><br>A football business simulation.<br>Built for the beautiful game.</div></aside><main class="main"><div class="topbar"><div class="eyebrow">${titles[screen]}</div><div class="top-right"><div class="pill">SEASON <b>${state.season}/5</b></div><div class="pill">WEEK <b>${state.week}/${MAX_MATCHES}</b></div><button class="iconbtn" title="Game guide" data-action="help">?</button></div></div>${content[screen]()}<footer>© THE BOARDROOM · A fictional football management simulation · <b>Progress automatically saved</b></footer></main></div>`;if(modal)showModal()}
function setup(){document.getElementById('app').innerHTML=`<main style="min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at center,#214536,#081015 75%)"><div class="modal" style="max-width:560px;width:100%"><div class="eyebrow">WELCOME, CHAIRPERSON</div><div style="font-size:70px;margin:19px 0">🏟️</div><h1 style="font-size:clamp(33px,6vw,49px);line-height:1;letter-spacing:-2px;margin-bottom:13px">FROM THE STANDS<br>TO THE <span style="color:var(--lime)">BOARDROOM.</span></h1><p>You just inherited a struggling football club. You have five seasons to pay off €10 million in debt, sign stars and lead your team to glory.</p><label style="font-weight:800;font-size:12px">YOUR CLUB NAME</label><input id="clubname" class="field" value="Phoenix FC" maxlength="24" aria-label="Your club name"><button class="btn primary" id="startgame" style="width:100%;font-size:14px">TAKE OVER THE CLUB →</button><p style="text-align:center;margin:18px 0 0;font-size:11px">A fully interactive fictional football tycoon. No account needed.</p></div></main>`;document.querySelector('#startgame').onclick=()=>{let name=document.querySelector('#clubname').value.trim().slice(0,24)||'Phoenix FC';state=fresh(name);save();render();notify('The board has handed you the keys. Good luck, boss!')};document.querySelector('#clubname').addEventListener('keydown',e=>{if(e.key==='Enter')document.querySelector('#startgame').click()})}
function showModal(){let body='';if(modal.type==='tactics'){body=`<div class="eyebrow">MATCHDAY DECISION</div><h2>Your tactical approach</h2><p>Choose your style of play against ${nextOpponent()}. Attacking creates more chances but opens up your defence.</p><div class="stack"><button class="btn secondary" data-action="play" data-id="defensive">🛡️ Defensive — Protect your goal</button><button class="btn secondary" data-action="play" data-id="balanced">⚖️ Balanced — Control the match</button><button class="btn primary" data-action="play" data-id="attacking">⚡ Attacking — Go for glory</button></div>`}else if(modal.type==='result'){let r=state.lastMatch;body=`<div class="eyebrow">FULL-TIME WHISTLE</div><h2>${r.ours>r.theirs?'A glorious victory!':r.ours<r.theirs?'A tough result.':'Honours even.'}</h2><div class="matchbox"><div class="small">${esc(state.club)} — ${esc(r.opponent)}</div><div class="score">${r.ours} – ${r.theirs}</div><div class="big-feedback">${r.ours>r.theirs?'THREE POINTS!':r.ours<r.theirs?'BACK TO THE DRAWING BOARD':'ONE POINT EARNED'}</div></div><div class="result-summary"><div class="row-between"><span>Matchday earnings</span><b class="value-green">+${fmt(r.revenue)}</b></div><div class="row-between" style="margin-top:12px"><span>Running costs</span><b class="value-red">−${fmt(r.costs)}</b></div><div class="row-between" style="margin-top:12px"><span>League points</span><b>+${r.points}</b></div></div><button class="btn primary" style="width:100%" data-action="dismiss">Continue Career →</button>`}else if(modal.type==='season'){body=`<div class="eyebrow">SEASON REVIEW</div><h2>Season ${state.season} Complete!</h2><p>Your club has battled through ten league matches. The board evaluates your performance before the new campaign begins.</p><div class="result-summary"><div class="row-between"><span>League points</span><b>${state.points}</b></div><div class="row-between" style="margin-top:10px"><span>Season record</span><b>${state.wins}W / ${state.draws}D / ${state.losses}L</b></div><div class="row-between" style="margin-top:10px"><span>Reputation</span><b>${state.reputation}/100</b></div></div><p>${state.points>=21?'An outstanding campaign! The supporters are dreaming big.':state.points>=14?'A respectable season. Keep building the project.':'The board expects improvement next season.'}</p><button class="btn primary" style="width:100%" data-action="nextseason">${state.season===5?'View Final Legacy':'Start Next Season →'}</button>`}else if(modal.type==='end'){body=`<div class="eyebrow">THE FINAL WHISTLE</div><h2>Your five-year legacy</h2><p>The board has completed its review of your time in charge of ${esc(state.club)}.</p><div class="matchbox"><span class="small">FINAL MANAGER RATING</span><div class="score" style="color:var(--lime)">${score().toLocaleString()}</div><div class="big-feedback">${state.debt===0&&state.reputation>=65?'CLUB LEGEND':score()>2100?'MASTER STRATEGIST':score()>1200?'PROMISING CHAIRPERSON':'REBUILD REQUIRED'}</div></div><div class="result-summary"><div class="row-between"><span>Debt remaining</span><b>${compact(state.debt)}</b></div><div class="row-between" style="margin-top:10px"><span>Career reputation</span><b>${state.reputation}/100</b></div><div class="row-between" style="margin-top:10px"><span>Total wins</span><b>${state.wins}</b></div></div><button class="btn primary" style="width:100%" data-action="dismiss">Explore Your Legacy</button>`}else if(modal.type==='confirm'){body=`<h2>Start a new career?</h2><p>This will permanently replace your current saved club. Are you sure?</p><div class="choice"><button data-action="dismiss">Cancel</button><button data-action="confirmreset">Start Fresh</button></div>`}else{body=`<h2>How to Play</h2><p><b>Goal:</b> Build the best possible football club across five seasons (10 matches per season). Your final score rewards wins, reputation, facilities, cash and debt reduction.</p><p><b>Transfers:</b> Sign better players to improve your chances in matches. Sell existing players if you need cash.</p><p><b>Matches:</b> Choose a tactical approach and receive ticket/sponsor income after each game. Results use your squad rating, training level, morale and an element of chance.</p><p><b>Facilities:</b> Expand the stadium for ticket revenue; improve training for performance; invest in your academy for future players.</p><p><b>Finance:</b> Repay club debt before your five seasons are up. Everything autosaves on this browser.</p><button class="btn primary" style="width:100%" data-action="dismiss">Let's Play</button>`}const el=document.createElement('div');el.className='modal-backdrop';el.id='overlay';el.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${body}</div>`;document.body.appendChild(el)}
function closeModal(){document.querySelector('#overlay')?.remove();modal=null}
function play(tactic){if(state.ended)return notify('Your five-season career is complete.');let enemy=65+((state.week*7+state.season*11)%15);let strength=avg()+state.training*2+(state.morale-50)/10;let bonus={defensive:-.26,balanced:0,attacking:.36}[tactic];function goals(attack,defense){let x=Math.max(.12,1.05+(attack-defense)*.061+bonus);let outcome=0;for(let i=0;i<5;i++)if(Math.random()<Math.min(.78,x/5))outcome++;return outcome}let ours=goals(strength,enemy),theirs=goals(enemy,strength)-(tactic==='defensive'?1:0)+(tactic==='attacking'&&Math.random()<.33?1:0);theirs=Math.max(0,theirs);let pts=ours>theirs?3:ours===theirs?1:0;let ticket=Math.round((55000+state.fans*11)*(.7+state.stadium*.4));let sponsor=90000+state.reputation*2300;let rev=ticket+sponsor;let costs=wages()+40000+state.stadium*9000;state.budget+=rev-costs;state.points+=pts;state.goalsFor+=ours;state.goalsAgainst+=theirs;if(pts===3){state.wins++;state.morale=Math.min(100,state.morale+7);state.fans+=800+state.stadium*150;state.reputation=Math.min(100,state.reputation+3)}else if(pts===1){state.draws++;state.morale=Math.min(100,state.morale+1);state.fans+=120;state.reputation=Math.min(100,state.reputation+1)}else{state.losses++;state.morale=Math.max(15,state.morale-5);state.fans=Math.max(2000,state.fans-240);state.reputation=Math.max(10,state.reputation-1)}let opponent=nextOpponent();state.lastMatch={ours,theirs,opponent,points:pts,revenue:rev,costs,tactic:tactic[0].toUpperCase()+tactic.slice(1)};note(`${state.club} ${ours}–${theirs} ${opponent} · ${pts} league points`);state.week++;let end=state.week>MAX_MATCHES;if(end)state.week=MAX_MATCHES;save();closeModal();modal={type:'result'};render();if(end)state.lastEvent='season'}
function nextSeason(){closeModal();if(state.season>=5){state.ended=true;note('Your five-season career has concluded.');save();modal={type:'end'};render();return}let previous=state.season;let prize=Math.round((state.points/30)*950000+150000);state.budget+=prize;note(`Season ${previous} prize money: ${fmt(prize)}.`);state.season++;state.week=1;state.points=0;state.wins=0;state.draws=0;state.losses=0;state.goalsFor=0;state.goalsAgainst=0;state.morale=Math.min(100,state.morale+5);if(state.academy>=2){let id=200+state.season;let talent={id,name:['Kai Jensen','Aiden Clarke','Marco Bianchi','Isaac Novak'][state.season-2],pos:['CM','ST','CB','LW'][state.season-2],rating:65+state.academy*3+state.season,age:18,wage:200};state.players.push(talent);note(`Academy breakthrough! ${talent.name} joins your squad.`)}note(`Season ${state.season} begins. The board expects progress.`);state.lastEvent=null;state.lastMatch=null;screen='dashboard';save();render();notify(`Season ${state.season} has started. Prize money: ${fmt(prize)}`)}
function transact(action,id){if(action==='buy'){let p=state.market.find(p=>p.id==id);if(!p)return;if(state.budget<p.cost)return notify('Insufficient transfer funds.');state.budget-=p.cost;state.players.push(p);state.market=state.market.filter(x=>x.id!==p.id);state.reputation=Math.min(100,state.reputation+1);note(`Signed ${p.name} for ${fmt(p.cost)}.`);notify(`${p.name} has signed for ${state.club}!`)}if(action==='sell'){let p=state.players.find(p=>p.id==id);if(!p||state.players.length<=5)return notify('Keep at least five players in your squad.');let amount=playerValue(p);state.budget+=amount;state.players=state.players.filter(x=>x.id!==p.id);state.morale=Math.max(10,state.morale-2);note(`Sold ${p.name} for ${fmt(amount)}.`);notify(`${p.name} sold for ${fmt(amount)}.`)}if(action==='upgrade'){if(!UPGRADE_META[id]||state[id]>=5||state.budget<upgradeCost(id))return;let price=upgradeCost(id);state.budget-=price;state[id]++;if(id==='training'){state.morale=Math.min(100,state.morale+4);state.players=state.players.map(p=>({...p,rating:Math.min(95,p.rating+1)}))}note(`${UPGRADE_META[id].name} upgraded to Level ${state[id]}.`);notify(`${UPGRADE_META[id].name} upgraded!`)}if(action==='repay'){let amount=Math.min(500000,state.debt,Math.floor(state.budget/100000)*100000);if(amount<100000)return;state.budget-=amount;state.debt-=amount;state.reputation=Math.min(100,state.reputation+2);note(`Paid ${fmt(amount)} toward outstanding club debt.`);notify(`${fmt(amount)} repaid. Strong financial leadership!`)}save();render()}
document.addEventListener('click',e=>{let btn=e.target.closest('[data-action]');if(!btn)return;let action=btn.dataset.action,id=btn.dataset.id;if(action==='page'){closeModal();screen=btn.dataset.target;render();window.scrollTo(0,0)}else if(action==='tab'){tab=id;render()}else if(['buy','sell','upgrade','repay'].includes(action)){if(state.ended)return notify('Career complete. Start a new save to play again.');transact(action,id)}else if(action==='tactics'){if(state.ended)return notify('Your career has ended.');modal=state.lastEvent==='season'?{type:'season'}:{type:'tactics'};render()}else if(action==='play'){play(id)}else if(action==='dismiss'){let endedMatch=modal?.type==='result'&&state.lastEvent==='season';closeModal();if(endedMatch){modal={type:'season'};render()}else render()}else if(action==='nextseason')nextSeason();else if(action==='help'){modal={type:'help'};render()}else if(action==='reset'){modal={type:'confirm'};render()}else if(action==='confirmreset'){localStorage.removeItem(KEY);state=null;modal=null;document.querySelector('#overlay')?.remove();setup()}});
render();
</script></body></html>
